<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    background:#1e293b;
    padding:20px;
    border-radius:16px;
}

h1{
    text-align:center;
}

#chat{
    height:400px;
    overflow-y:auto;
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.message{
    margin-bottom:12px;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#2563eb;
}

.ai{
    background:#374151;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

</style>
</head>

<body>

<div class="container">

<h1>🚀 Nexora AI</h1>

<div id="chat"></div>

<div class="input-area">
<input type="text" id="prompt" placeholder="Ask Nexora anything...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

async function sendMessage(){

    const input = document.getElementById("prompt");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if(!text) return;

    chat.innerHTML += `
    <div class="message user">
        <b>You:</b> ${text}
    </div>
    `;

    input.value = "";

    try{

        const res = await fetch("/api/nexora",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                prompt:text
            })
        });

        const data = await res.json();

        chat.innerHTML += `
        <div class="message ai">
            <b>Nexora:</b> ${data.response}
        </div>
        `;

        chat.scrollTop = chat.scrollHeight;

    }catch(err){

        chat.innerHTML += `
        <div class="message ai">
            <b>Error:</b> Failed to connect.
        </div>
        `;
    }
}

</script>

</body>
</html>
